<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>EdgeShort</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #e8edf9; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 20%, #172554 0, transparent 34rem), radial-gradient(circle at 80% 80%, #1e1b4b 0, transparent 30rem), #0b1020; }
      main { max-width: 560px; text-align: center; }
      .mark { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 20px; font-weight: 800; font-size: 26px; background: linear-gradient(135deg, #60a5fa, #818cf8); color: #0b1020; box-shadow: 0 18px 60px #0008; }
      h1 { font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -.07em; margin: 0; }
      p { color: #a6b1cc; line-height: 1.65; margin: 18px 0 28px; }
      a { display: inline-block; padding: 12px 18px; border-radius: 10px; color: #0b1020; background: #e8edf9; font-weight: 750; text-decoration: none; }
      a:hover { background: white; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">↗</div>
      <h1>EdgeShort</h1>
      <p>A private, fast URL shortener running on EdgeOne.</p>
      <a href="/admin/">Open admin</a>
    </main>
  </body>
</html>
