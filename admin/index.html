<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b1020">
    <title>EdgeShort — 管理后台</title>
    <link rel="stylesheet" href="/admin/style.css?v=20260731-3">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="EdgeShort 首页"><span class="brand-mark">↗</span><span>EdgeShort</span></a>
        <div class="top-actions"><button class="language-button" id="language-toggle" type="button" aria-label="切换至英文">EN</button><button class="button button-quiet" id="sign-out" type="button" hidden data-i18n="signOut">退出登录</button></div>
      </header>

      <main>
        <section class="login-view" id="login-view" aria-labelledby="login-heading" hidden>
          <div class="login-card">
            <span class="eyebrow" data-i18n="privateAdmin">私有管理后台</span>
            <h1 id="login-heading" data-i18n="welcomeBack">欢迎回来</h1>
            <p data-i18n="signInDescription">登录后管理你的短链接。</p>
            <form id="login-form">
              <label for="password" data-i18n="password">密码</label>
              <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="button" class="text-button" id="toggle-password" data-i18n="show">显示</button></div>
              <p class="form-error" id="login-error" role="alert"></p>
              <button class="button button-primary button-full" type="submit"><span data-i18n="signIn">登录</span> <span aria-hidden="true">→</span></button>
            </form>
          </div>
        </section>

        <section class="dashboard" id="dashboard" hidden>
          <div class="page-intro">
            <div><span class="eyebrow" data-i18n="yourLinks">你的短链接</span><h1 data-i18n="shortLinksTitle">所有短链接，尽在一处。</h1><p data-i18n="shortLinksDescription">创建、管理和追踪每一条链接。</p></div>
            <button class="button button-primary" id="new-link" type="button"><span aria-hidden="true">＋</span> <span data-i18n="newLink">新建链接</span></button>
          </div>

          <section class="stats" aria-label="Link statistics">
            <div class="stat-card"><span data-i18n="totalLinks">链接总数</span><strong id="total-links">0</strong></div>
            <div class="stat-card"><span data-i18n="totalVisits">访问总数</span><strong id="total-visits">0</strong></div>
          </section>

          <section class="links-panel" aria-labelledby="links-heading">
            <div class="panel-header"><div><h2 id="links-heading" data-i18n="allLinks">全部链接</h2><p id="links-summary" data-i18n="loading">加载中…</p></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索链接" data-i18n-placeholder="searchLinks" autocomplete="off"><kbd>⌘ K</kbd></label></div>
            <div class="loading-state" id="loading-state"><span class="spinner" aria-hidden="true"></span> <span data-i18n="loadingLinks">正在加载链接</span></div>
            <div class="empty-state" id="empty-state" hidden><div class="empty-icon">↗</div><h3 data-i18n="noLinks">还没有链接</h3><p data-i18n="noLinksDescription">新建第一条短链接，它会显示在这里。</p><button class="button button-primary" type="button" data-new-link data-i18n="newLink">新建链接</button></div>
            <div class="table-wrap" id="table-wrap" hidden>
              <table><thead><tr><th data-i18n="shortLink">短链接</th><th data-i18n="destination">目标地址</th><th class="number" data-i18n="visits">访问</th><th data-i18n="updated">更新时间</th><th><span class="sr-only" data-i18n="actions">操作</span></th></tr></thead><tbody id="links-table"></tbody></table>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="link-dialog" aria-labelledby="dialog-title">
      <form class="dialog-card" id="link-form" method="dialog">
        <div class="dialog-header"><div><span class="eyebrow" id="dialog-eyebrow">新建链接</span><h2 id="dialog-title">新建短链接</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div>
        <input type="hidden" id="editing-code">
        <label for="link-url"><span data-i18n="destinationUrl">目标链接</span> <span>*</span></label><input id="link-url" type="url" inputmode="url" placeholder="https://example.com/long-link" required>
        <label for="link-title"><span data-i18n="label">备注名称</span> <small data-i18n="optional">可选</small></label><input id="link-title" type="text" maxlength="120" placeholder="例如：夏日活动" data-i18n-placeholder="labelPlaceholder">
        <div id="code-wrap"><label for="link-code"><span data-i18n="customCode">自定义短码</span> <small data-i18n="optional">可选</small></label><div class="code-field"><span id="code-prefix"></span><input id="link-code" type="text" maxlength="64" pattern="[A-Za-z0-9_-]{3,64}" placeholder="my-link" autocomplete="off"></div><p class="field-help" data-i18n="codeHelp">留空将自动生成安全短码。</p></div>
        <p class="form-error" id="link-error" role="alert"></p>
        <div class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog data-i18n="cancel">取消</button><button class="button button-primary" id="save-link" type="submit">新建链接</button></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/admin/app.js?v=20260731-3" defer></script>
  </body>
</html>
